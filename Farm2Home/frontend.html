<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm2Home — Buy Direct from Farmers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F0EEDC;
    --bg-alt:#E6E3CB;
    --ink:#23301D;
    --ink-soft:#4E5A42;
    --green:#3B5D3A;
    --green-dark:#233A22;
    --marigold:#E3963E;
    --marigold-dark:#B96F22;
    --brown:#6B4A31;
    --card:#FBF8EE;
    --white:#FFFDF7;
    --red:#AE4128;
    --line: rgba(35,48,29,0.14);
    --shadow-tag: 0 2px 0 rgba(35,48,29,0.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--green-dark);
  }
  .mono{ font-family:'Space Mono', monospace; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  img{max-width:100%;display:block;}
  .container{ max-width:1120px; margin:0 auto; padding:0 24px; }
  .hidden{ display:none !important; }

  /* ---------- NAV ---------- */
  header.site{
    position:sticky; top:0; z-index:40;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .navwrap{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; max-width:1120px; margin:0 auto; gap:16px;
  }
  .logo{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .logo .mark{
    width:34px;height:34px;border-radius:8px;background:var(--green);
    display:flex;align-items:center;justify-content:center;
    color:var(--white); font-family:'Fraunces',serif; font-weight:700; font-size:18px;
    transform:rotate(-4deg);
  }
  .logo .word{ font-family:'Fraunces',serif; font-weight:700; font-size:21px; color:var(--green-dark); }
  .logo .word span{ color:var(--marigold); }
  nav.links{ display:flex; align-items:center; gap:22px; font-size:15px; font-weight:500; }
  nav.links a{ cursor:pointer; text-decoration:none; color:var(--ink-soft); padding:4px 0; border-bottom:2px solid transparent; }
  nav.links a:hover{ color:var(--green-dark); }
  nav.links a.active{ color:var(--green-dark); border-bottom-color:var(--marigold); }
  .navactions{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    position:relative; background:none; border:1px solid var(--line); border-radius:8px;
    width:38px;height:38px; display:flex;align-items:center;justify-content:center;
    color:var(--green-dark);
  }
  .icon-btn:hover{ border-color:var(--green); }
  .badge-count{
    position:absolute; top:-6px; right:-6px; background:var(--marigold); color:var(--white);
    font-size:11px; font-weight:700; border-radius:50%; width:18px;height:18px;
    display:flex;align-items:center;justify-content:center; font-family:'Space Mono',monospace;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 18px; border-radius:8px; border:1.5px solid var(--green-dark);
    background:none; color:var(--green-dark); font-weight:600; font-size:14.5px;
    transition:transform .12s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-solid{ background:var(--green-dark); color:var(--white); border-color:var(--green-dark); }
  .btn-marigold{ background:var(--marigold); color:var(--white); border-color:var(--marigold-dark); }
  .btn-marigold:hover{ background:var(--marigold-dark); }
  .btn-outline{ background:none; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:7px 12px; font-size:13px; border-radius:7px; }
  .btn-danger{ border-color:var(--red); color:var(--red); }
  .pill-toggle{
    display:flex; background:var(--bg-alt); border-radius:9px; padding:3px; gap:2px;
  }
  .pill-toggle button{
    border:none; background:none; padding:8px 16px; border-radius:7px; font-weight:600; font-size:14px;
    color:var(--ink-soft);
  }
  .pill-toggle button.active{ background:var(--white); color:var(--green-dark); box-shadow:0 1px 2px rgba(0,0,0,0.08); }

  /* ---------- HERO ---------- */
  .hero{
    padding:64px 24px 40px; position:relative; overflow:hidden;
  }
  .hero-inner{
    max-width:1120px; margin:0 auto; display:grid; grid-template-columns:1.1fr 0.9fr; gap:48px; align-items:center;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:'Space Mono',monospace;
    font-size:12.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--green);
    background:rgba(59,93,58,0.09); padding:6px 12px; border-radius:20px; margin-bottom:18px;
  }
  .hero h1{ font-size:52px; line-height:1.04; margin-bottom:20px; }
  .hero h1 em{ font-style:italic; color:var(--marigold); }
  .hero p.lead{ font-size:18px; color:var(--ink-soft); max-width:480px; margin-bottom:28px; }
  .hero-ctas{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:30px; }
  .hero-stats{ display:flex; gap:32px; flex-wrap:wrap; }
  .hero-stats .stat b{ display:block; font-family:'Fraunces',serif; font-size:26px; color:var(--green-dark); }
  .hero-stats .stat span{ font-size:13px; color:var(--ink-soft); }

  .crate-hero{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:26px; transform:rotate(2deg); box-shadow:0 14px 0 -6px rgba(35,48,29,0.06);
  }
  .crate-hero::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:16px;height:16px; border-radius:50%; background:var(--bg); border:1px solid var(--line);
  }
  .stamp{
    position:absolute; top:18px; right:18px; border:2px solid var(--red); color:var(--red);
    font-family:'Space Mono',monospace; font-weight:700; font-size:11px; letter-spacing:0.05em;
    padding:5px 9px; border-radius:6px; transform:rotate(-9deg); opacity:0.85;
  }
  .crate-hero h3{ font-size:20px; margin-bottom:4px;}
  .crate-hero .from{ font-size:13px; color:var(--ink-soft); margin-bottom:16px; }
  .crate-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px dashed var(--line); font-size:14px; }
  .crate-row:first-of-type{ border-top:none; }
  .crate-price{ font-family:'Space Mono',monospace; font-weight:700; color:var(--green-dark); }

  /* ---------- HOW IT WORKS ---------- */
  section.how{ padding:56px 24px; background:var(--bg-alt); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .how-head{ text-align:center; max-width:560px; margin:0 auto 42px; }
  .how-head h2{ font-size:32px; margin-bottom:10px; }
  .how-head p{ color:var(--ink-soft); font-size:15.5px; }
  .how-grid{ max-width:1120px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .how-card{ background:var(--white); border:1px solid var(--line); border-radius:12px; padding:26px; }
  .how-num{ font-family:'Space Mono',monospace; font-size:13px; color:var(--marigold-dark); font-weight:700; margin-bottom:10px; }
  .how-card h3{ font-size:19px; margin-bottom:8px; }
  .how-card p{ font-size:14.5px; color:var(--ink-soft); margin:0; }

  /* ---------- MARKETPLACE PREVIEW / SECTIONS ---------- */
  section.pad{ padding:56px 24px; }
  .section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; gap:16px; flex-wrap:wrap; }
  .section-head h2{ font-size:28px; }
  .section-head p{ color:var(--ink-soft); font-size:14.5px; margin-top:4px; }

  .farmer-cta{
    max-width:1120px; margin:0 auto; background:var(--green-dark); border-radius:16px; padding:44px;
    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; color:var(--white);
  }
  .farmer-cta h2{ color:var(--white); font-size:28px; max-width:460px; }
  .farmer-cta p{ color:rgba(255,255,255,0.75); max-width:460px; margin-top:8px; font-size:15px; }
  .farmer-cta .btn-marigold{ white-space:nowrap; }

  /* ---------- PRODUCT GRID / CRATE TAGS ---------- */
  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; align-items:center; }
  .chip{
    border:1px solid var(--line); background:var(--white); border-radius:20px; padding:7px 14px;
    font-size:13.5px; font-weight:500; color:var(--ink-soft);
  }
  .chip.active{ background:var(--green-dark); color:var(--white); border-color:var(--green-dark); }
  .search-box{
    flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--white);
    border:1px solid var(--line); border-radius:20px; padding:8px 14px;
  }
  .search-box input{ border:none; outline:none; background:none; font-size:14px; width:100%; font-family:inherit; }

  .grid-products{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:26px 22px; }
  .ptag{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:20px 16px 16px; box-shadow:var(--shadow-tag);
  }
  .ptag:nth-child(3n+1){ transform:rotate(-0.6deg); }
  .ptag:nth-child(3n+2){ transform:rotate(0.5deg); }
  .ptag:nth-child(3n+3){ transform:rotate(-0.3deg); }
  .ptag:hover{ transform:rotate(0deg) translateY(-2px); }
  .ptag::before{
    content:''; position:absolute; top:-7px; left:22px; width:13px;height:13px; border-radius:50%;
    background:var(--bg); border:1px solid var(--line);
  }
  .ptag .cat{ font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--green); margin-bottom:6px; }
  .ptag h4{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin-bottom:4px; color:var(--green-dark); }
  .ptag .farm{ font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; display:flex; align-items:center; gap:5px;}
  .ptag .priceline{ display:flex; align-items:baseline; justify-content:space-between; border-top:1px dashed var(--line); padding-top:10px; margin-bottom:12px; }
  .ptag .price{ font-family:'Space Mono',monospace; font-weight:700; font-size:17px; color:var(--green-dark); }
  .ptag .unit{ font-size:12px; color:var(--ink-soft); }
  .ptag .stock{ font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; }
  .ptag .stock.low{ color:var(--red); }
  .ptag-actions{ display:flex; gap:8px; align-items:center; }
  .qty-input{
    width:52px; border:1px solid var(--line); border-radius:7px; padding:7px 6px; text-align:center;
    font-family:'Space Mono',monospace; font-size:13px;
  }
  .empty-note{ text-align:center; color:var(--ink-soft); font-size:14.5px; padding:50px 20px; border:1px dashed var(--line); border-radius:12px; }

  /* ---------- AUTH ---------- */
  .auth-wrap{ max-width:480px; margin:48px auto; }
  .auth-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:34px; }
  .auth-card h2{ font-size:26px; margin-bottom:6px; }
  .auth-card > p.sub{ color:var(--ink-soft); font-size:14.5px; margin-bottom:22px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--white); border-radius:8px;
    padding:11px 12px; font-size:14.5px; font-family:inherit; color:var(--ink); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--green); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .err-text{ color:var(--red); font-size:12.5px; margin-top:5px; display:none; }
  .err-text.show{ display:block; }
  .field.error input, .field.error select{ border-color:var(--red); }
  .form-error{ background:rgba(174,65,40,0.1); color:var(--red); border-radius:8px; padding:10px 14px; font-size:13.5px; margin-bottom:16px; display:none; }
  .form-error.show{ display:block; }
  .switchline{ text-align:center; margin-top:18px; font-size:14px; color:var(--ink-soft); }
  .switchline a{ color:var(--green); font-weight:600; cursor:pointer; text-decoration:underline; }

  /* ---------- DASHBOARD ---------- */
  .dash-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:8px; }
  .dash-tag{ display:inline-flex; align-items:center; gap:8px; background:rgba(59,93,58,0.09); color:var(--green); padding:6px 12px; border-radius:20px; font-size:13px; font-weight:600; margin-bottom:14px; }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:24px 0 36px; }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
  .stat-card .n{ font-family:'Fraunces',serif; font-size:28px; color:var(--green-dark); }
  .stat-card .l{ font-size:13px; color:var(--ink-soft); margin-top:2px; }

  .panel{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:26px; margin-bottom:26px; }
  .panel h3{ font-size:19px; margin-bottom:18px; }

  table.list{ width:100%; border-collapse:collapse; font-size:14px; }
  table.list th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); font-weight:600; }
  table.list td{ padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.list tr:last-child td{ border-bottom:none; }
  .tbl-name{ font-weight:600; color:var(--green-dark); }
  .stock-edit{ width:64px; border:1px solid var(--line); border-radius:6px; padding:5px 6px; font-family:'Space Mono',monospace; font-size:13px; }
  .status-tag{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:12px; text-transform:uppercase; letter-spacing:0.03em; }
  .status-tag.ok{ background:rgba(59,93,58,0.12); color:var(--green-dark); }
  .status-tag.low{ background:rgba(227,150,62,0.18); color:var(--marigold-dark); }
  .status-tag.out{ background:rgba(174,65,40,0.12); color:var(--red); }

  /* ---------- CART ---------- */
  .cart-layout{ display:grid; grid-template-columns:1.6fr 1fr; gap:26px; align-items:start; }
  .cart-item{ display:flex; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--line); }
  .cart-item:last-child{ border-bottom:none; }
  .cart-thumb{ width:52px;height:52px; border-radius:8px; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .cart-info{ flex:1; }
  .cart-info .nm{ font-weight:600; color:var(--green-dark); }
  .cart-info .sub{ font-size:12.5px; color:var(--ink-soft); }
  .cart-qty{ display:flex; align-items:center; gap:8px; }
  .qty-btn{ width:26px;height:26px; border-radius:6px; border:1px solid var(--line); background:var(--white); font-weight:700; display:flex;align-items:center;justify-content:center; }
  .cart-sub{ font-family:'Space Mono',monospace; font-weight:700; width:80px; text-align:right; }
  .summary-row{ display:flex; justify-content:space-between; font-size:14.5px; padding:8px 0; }
  .summary-row.total{ border-top:1px solid var(--line); margin-top:8px; padding-top:14px; font-size:17px; font-weight:700; color:var(--green-dark); }

  /* ---------- ORDERS ---------- */
  .order-card{ border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; background:var(--white); }
  .order-top{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .order-id{ font-family:'Space Mono',monospace; font-size:12.5px; color:var(--ink-soft); }
  .order-items{ font-size:13.5px; color:var(--ink-soft); }
  .order-total{ font-weight:700; color:var(--green-dark); }

  footer.site{ border-top:1px solid var(--line); padding:34px 24px; margin-top:40px; }
  .footwrap{ max-width:1120px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; font-size:13.5px; color:var(--ink-soft); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--green-dark); color:var(--white); padding:12px 22px; border-radius:10px;
    font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:all .25s ease; z-index:100;
    display:flex; align-items:center; gap:10px;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media(max-width:860px){
    .hero-inner{ grid-template-columns:1fr; }
    .hero h1{ font-size:38px; }
    .how-grid{ grid-template-columns:1fr; }
    .cart-layout{ grid-template-columns:1fr; }
    .stat-row{ grid-template-columns:1fr; }
    nav.links{ display:none; }
    .field-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="navwrap">
    <div class="logo" onclick="go('landing')">
      <div class="mark">F2</div>
      <div class="word">Farm2<span>Home</span></div>
    </div>
    <nav class="links">
      <a onclick="go('landing')" data-nav="landing">Home</a>
      <a onclick="go('marketplace')" data-nav="marketplace">Marketplace</a>
      <a id="navDashboard" onclick="go('dashboard')" data-nav="dashboard" class="hidden">My farm</a>
      <a id="navOrders" onclick="go('orders')" data-nav="orders" class="hidden">Orders</a>
    </nav>
    <div class="navactions">
      <button class="icon-btn hidden" id="cartBtn" onclick="go('cart')" title="Cart">
        🧺<span class="badge-count hidden" id="cartCount">0</span>
      </button>
      <div id="authArea"></div>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="site">
  <div class="footwrap">
    <div>© 2026 Farm2Home. Grown local, sold direct.</div>
    <div>A working prototype — connect a real backend before going live.</div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ============ DATA LAYER ============ */
const CATEGORIES = ["Vegetables","Fruits","Grains & Pulses","Dairy","Spices","Other"];
const UNITS = ["kg","gram","dozen","litre","piece"];
const EMOJI = { "Vegetables":"🥬","Fruits":"🍎","Grains & Pulses":"🌾","Dairy":"🥛","Spices":"🌶️","Other":"🧺" };

let DB = { users: [], products: [], orders: [] };
let session = null; // {email, role, name, ...}
let cart = []; // [{productId, qty}]
let currentFilter = "All";
let searchQuery = "";
let route = "landing";

async function loadDB(){
  try{
    const [u,p,o] = await Promise.all([
      safeGet('f2h_users'), safeGet('f2h_products'), safeGet('f2h_orders')
    ]);
    DB.users = u || [];
    DB.products = p || [];
    DB.orders = o || [];
  }catch(e){ console.error('load failed', e); }
}
async function safeGet(key){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveUsers(){ await window.storage.set('f2h_users', JSON.stringify(DB.users), true); }
async function saveProducts(){ await window.storage.set('f2h_products', JSON.stringify(DB.products), true); }
async function saveOrders(){ await window.storage.set('f2h_orders', JSON.stringify(DB.orders), true); }

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function fmt(n){ return '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:2}); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}

/* ============ ROUTER ============ */
function go(r){
  if((r==='dashboard') && (!session || session.role!=='farmer')){ r='auth'; window._authMode='login'; window._authRole='farmer'; }
  if((r==='cart' || r==='orders') && !session){ r='auth'; window._authMode='login'; window._authRole='customer'; }
  route = r;
  document.querySelectorAll('nav.links a').forEach(a=>a.classList.toggle('active', a.dataset.nav===r));
  window.scrollTo({top:0, behavior:'instant'});
  render();
}

/* ============ AUTH ============ */
function currentFarmerProducts(){
  return DB.products.filter(p=>p.farmerEmail === session.email);
}
async function handleSignup(role){
  const name = val('su_name'), mobile = val('su_mobile'), email = val('su_email').toLowerCase(), pass = val('su_pass');
  let extra = {};
  let missing = !name || !mobile || !email || !pass;
  if(role==='farmer'){
    extra.farmName = val('su_farmname'); extra.farmLocation = val('su_farmloc');
    if(!extra.farmName || !extra.farmLocation) missing = true;
  }else{
    extra.address = val('su_address');
    if(!extra.address) missing = true;
  }
  const errBox = document.getElementById('authFormErr');
  if(missing){ errBox.textContent = 'Please fill in every field.'; errBox.classList.add('show'); return; }
  if(DB.users.find(u=>u.email===email)){ errBox.textContent = 'An account with this email already exists. Try logging in.'; errBox.classList.add('show'); return; }
  errBox.classList.remove('show');
  const user = { email, name, mobile, pass, role, ...extra, createdAt: Date.now() };
  DB.users.push(user);
  await saveUsers();
  session = user;
  toast(role==='farmer' ? `Welcome to Farm2Home, ${name}! Your farm stall is ready.` : `Welcome to Farm2Home, ${name}!`);
  go(role==='farmer' ? 'dashboard' : 'marketplace');
}
function handleLogin(){
  const email = val('li_email').toLowerCase(), pass = val('li_pass');
  const errBox = document.getElementById('authFormErr');
  const user = DB.users.find(u=>u.email===email && u.pass===pass);
  if(!user){ errBox.textContent = 'No account matches that email and password.'; errBox.classList.add('show'); return; }
  errBox.classList.remove('show');
  session = user;
  cart = [];
  toast(`Welcome back, ${user.name.split(' ')[0]}!`);
  go(user.role==='farmer' ? 'dashboard' : 'marketplace');
}
function logout(){
  session = null; cart = [];
  toast('Logged out.');
  go('landing');
}
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

/* ============ PRODUCTS ============ */
async function addProduct(){
  const name = val('pf_name'), category = val('pf_cat'), price = parseFloat(val('pf_price')),
        unit = val('pf_unit'), stock = parseInt(val('pf_stock')), desc = val('pf_desc');
  const errBox = document.getElementById('pfErr');
  if(!name || !category || !price || price<=0 || !unit || isNaN(stock) || stock<0){
    errBox.textContent = 'Fill in a valid product name, category, price and stock.';
    errBox.classList.add('show'); return;
  }
  errBox.classList.remove('show');
  DB.products.unshift({
    id: uid('prod'), farmerEmail: session.email, farmName: session.farmName, farmLocation: session.farmLocation,
    name, category, price, unit, stock, description: desc, createdAt: Date.now()
  });
  await saveProducts();
  toast(`${name} is now listed on the marketplace.`);
  ['pf_name','pf_price','pf_stock','pf_desc'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  render();
}
async function updateStock(id, newStock){
  const p = DB.products.find(p=>p.id===id);
  if(!p) return;
  p.stock = Math.max(0, parseInt(newStock)||0);
  await saveProducts();
  render();
}
async function deleteProduct(id){
  DB.products = DB.products.filter(p=>p.id!==id);
  await saveProducts();
  toast('Product removed from your stall.');
  render();
}

/* ============ CART ============ */
function addToCart(productId){
  if(!session || session.role!=='customer'){ window._authMode='login'; window._authRole='customer'; go('auth'); return; }
  const qtyEl = document.getElementById('qty_'+productId);
  const qty = qtyEl ? Math.max(1, parseInt(qtyEl.value)||1) : 1;
  const product = DB.products.find(p=>p.id===productId);
  if(!product || product.stock < 1){ toast('Out of stock.'); return; }
  const existing = cart.find(c=>c.productId===productId);
  const already = existing ? existing.qty : 0;
  if(already + qty > product.stock){ toast(`Only ${product.stock} ${product.unit} left in stock.`); return; }
  if(existing) existing.qty += qty; else cart.push({productId, qty});
  toast(`Added ${qty} ${product.unit} of ${product.name} to your basket.`);
  render();
}
function changeCartQty(productId, delta){
  const item = cart.find(c=>c.productId===productId);
  const product = DB.products.find(p=>p.id===productId);
  if(!item || !product) return;
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(c=>c.productId!==productId); }
  else if(item.qty > product.stock){ item.qty = product.stock; toast('That is all the stock available.'); }
  render();
}
function removeFromCart(productId){
  cart = cart.filter(c=>c.productId!==productId);
  render();
}
function cartTotal(){
  return cart.reduce((sum,c)=>{ const p = DB.products.find(p=>p.id===c.productId); return sum + (p? p.price*c.qty : 0); }, 0);
}
async function placeOrder(){
  if(cart.length===0) return;
  for(const c of cart){
    const p = DB.products.find(p=>p.id===c.productId);
    if(!p || p.stock < c.qty){ toast(`${p?p.name:'An item'} no longer has enough stock. Please adjust your basket.`); render(); return; }
  }
  const items = cart.map(c=>{
    const p = DB.products.find(p=>p.id===c.productId);
    p.stock -= c.qty;
    return { productId:p.id, name:p.name, farmName:p.farmName, farmerEmail:p.farmerEmail, price:p.price, unit:p.unit, qty:c.qty };
  });
  const order = { id: uid('order'), buyerEmail: session.email, buyerName: session.name, items, total: cartTotal(), createdAt: Date.now() };
  DB.orders.unshift(order);
  await Promise.all([saveProducts(), saveOrders()]);
  cart = [];
  toast('Order placed! The farmers have been notified.');
  go('orders');
}

/* ============ RENDER ============ */
function render(){
  renderNav();
  const app = document.getElementById('app');
  if(route==='landing') app.innerHTML = viewLanding();
  else if(route==='marketplace') app.innerHTML = viewMarketplace();
  else if(route==='auth') app.innerHTML = viewAuth();
  else if(route==='dashboard') app.innerHTML = viewDashboard();
  else if(route==='cart') app.innerHTML = viewCart();
  else if(route==='orders') app.innerHTML = viewOrders();
  wireAuthTabs();
}

function renderNav(){
  const authArea = document.getElementById('authArea');
  const dashLink = document.getElementById('navDashboard');
  const ordersLink = document.getElementById('navOrders');
  const cartBtn = document.getElementById('cartBtn');
  const cartCount = document.getElementById('cartCount');

  if(session){
    dashLink.classList.toggle('hidden', session.role!=='farmer');
    ordersLink.classList.toggle('hidden', false);
    ordersLink.textContent = session.role==='farmer' ? 'Orders' : 'My orders';
    cartBtn.classList.toggle('hidden', session.role!=='customer');
    const totalQty = cart.reduce((s,c)=>s+c.qty,0);
    cartCount.textContent = totalQty;
    cartCount.classList.toggle('hidden', totalQty===0);
    authArea.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:13.5px;color:var(--ink-soft);">${esc(session.name.split(' ')[0])} <span class="mono" style="font-size:11px;background:var(--bg-alt);padding:2px 7px;border-radius:10px;">${session.role}</span></span>
        <button class="btn btn-sm btn-outline" onclick="logout()">Log out</button>
      </div>`;
  } else {
    dashLink.classList.add('hidden');

    cartBtn.classList.add('hidden');
    authArea.innerHTML = `
      <button class="btn btn-sm" onclick="window._authMode='login';go('auth')">Log in</button>
      <button class="btn btn-sm btn-solid" onclick="window._authMode='signup';go('auth')">Sign up</button>`;
  }
}
